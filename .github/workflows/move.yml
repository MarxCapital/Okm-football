name: Sortir les fichiers du dossier
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déplacer
        run: |
          shopt -s dotglob
          mv okm-football-academie/* .
          rmdir okm-football-academie
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Déplacement des fichiers à la racine"
          git push
