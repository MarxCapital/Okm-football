name: Décompresser un zip dans le dépôt

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Chemin du zip (vide = premier .zip trouvé à la racine)"
        required: false
        default: ""
      target_dir:
        description: "Dossier de destination (. = racine)"
        required: false
        default: "."
      strip_root:
        description: "Retirer le dossier unique qui englobe tout"
        type: boolean
        default: true
      overwrite:
        description: "Écraser les fichiers existants"
        type: boolean
        default: true
      delete_zip:
        description: "Supprimer le zip après extraction"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Utilise le secret PAT s'il existe, sinon le token par défaut
          token: ${{ secrets.PAT || github.token }}

      - name: Décompresser et placer les fichiers
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
          TARGET: ${{ inputs.target_dir }}
          STRIP_ROOT: ${{ inputs.strip_root }}
          OVERWRITE: ${{ inputs.overwrite }}
          DELETE_ZIP: ${{ inputs.delete_zip }}
        run: |
          set -euo pipefail

          # 1. Trouver le zip
          ZIP="$ZIP_PATH"
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Aucun fichier zip trouvé"; exit 1
          fi
          echo "Zip utilisé : $ZIP"

          # 2. Extraire dans un dossier temporaire
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP"
          rm -rf "$TMP/__MACOSX"
          find "$TMP" -name '.DS_Store' -delete

          # 3. Si un seul dossier englobe tout, descendre dedans
          SRC="$TMP"
          if [ "$STRIP_ROOT" = "true" ]; then
            COUNT=$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)
            ONLY=$(find "$TMP" -mindepth 1 -maxdepth 1 | head -n1)
            if [ "$COUNT" -eq 1 ] && [ -d "$ONLY" ]; then
              echo "Dossier englobant retiré : $(basename "$ONLY")"
              SRC="$ONLY"
            fi
          fi

          # 4. Copier vers la destination (fichiers cachés inclus)
          mkdir -p "$TARGET"
          if [ "$OVERWRITE" = "true" ]; then
            rsync -a --exclude='.git/' "$SRC"/ "$TARGET"/
          else
            rsync -a --ignore-existing --exclude='.git/' "$SRC"/ "$TARGET"/
          fi

          # 5. Supprimer le zip si demandé
          if [ "$DELETE_ZIP" = "true" ]; then
            rm -f "$ZIP"
          fi

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter"
          else
            git commit -m "Extraction de l'archive zip"
            git push
          fi
